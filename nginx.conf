server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The edge proxy (Nginx Proxy Manager, 192.168.0.22) sets X-Real-IP to the connecting client. Trust it
    # from that host only, so the X-Forwarded-For sent to MeishiApi names the client and its login rate limit
    # is per client. This needs the Service's externalTrafficPolicy: Local; with SNAT the peer is a node
    # address, the header is ignored and the proxy address is used as before.
    set_real_ip_from 192.168.0.22/32;
    real_ip_header X-Real-IP;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location /api/ {
        proxy_pass http://meishi-api.default.svc.cluster.local:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
