# One JSON line per request on stdout (Alloy turns method, status class and level into Loki labels). The query string
# is never logged, and Kubernetes probes are left out. level follows the status so 5xx lines are errors.
map $status $log_level {
    ~^5     error;
    default info;
}

map $http_user_agent $log_request {
    ~^kube-probe/ 0;
    default       1;
}

log_format json escape=json '{"time":"$time_iso8601","level":"$log_level","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"requestTime":$request_time,"requestId":"$request_id"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout json if=$log_request;
    add_header X-Request-Id $request_id always;

    # The edge proxy (Nginx Proxy Manager, 192.168.0.22) sets X-Real-IP to the connecting client. Trust it
    # from that host only, so the X-Forwarded-For sent to MeishiApi names the client and its login rate limit
    # is per client. Until the ordered steps in MeishiApi docs/adr-meishi-identity-provider.md (migration
    # step 3) give the Service externalTrafficPolicy: Local, the peer is a node address after SNAT, this never
    # matches and behaviour is unchanged.
    set_real_ip_from 192.168.0.22/32;
    real_ip_header X-Real-IP;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location /api/ {
        proxy_pass http://meishi-api.default.svc.cluster.local:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_hide_header X-Request-Id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
