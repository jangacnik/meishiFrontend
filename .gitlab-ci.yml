# `test` runs automatically on every commit, every branch. `build`/`deploy`
# run automatically too, but only on the default branch. Every job is
# interruptible and the project has "auto-cancel redundant pipelines" on,
# so pushing again while a pipeline is still running cancels the older one.

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: node:22-alpine
  interruptible: true
  script:
    - npm ci
    - npm test

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --cache=true

deploy-production:
  stage: deploy
  image: alpine/k8s:1.31.13
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment: production
  variables:
    K8S_NAMESPACE: default
  script:
    - |
      cat > /tmp/kubeconfig.yaml <<EOF
      apiVersion: v1
      kind: Config
      clusters:
        - name: prod
          cluster:
            server: ${K8S_API_SERVER}
            certificate-authority-data: ${K8S_CA_CERT_B64}
      contexts:
        - name: deployer
          context:
            cluster: prod
            namespace: ${K8S_NAMESPACE}
            user: deployer
      current-context: deployer
      users:
        - name: deployer
          user:
            token: ${K8S_TOKEN}
      EOF
    - export KUBECONFIG=/tmp/kubeconfig.yaml
    - sed "s|__IMAGE__|$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|g" deploy/k8s/deployment.yaml > /tmp/deployment.yaml
    - kubectl apply --validate=false -n "$K8S_NAMESPACE" -f /tmp/deployment.yaml
    - kubectl apply --validate=false -n "$K8S_NAMESPACE" -f deploy/k8s/service.yaml
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/meishifrontend --timeout=120s
  # deploy/k8s/rbac.yaml is intentionally never applied here - apply once
  # yourself: kubectl apply -f deploy/k8s/rbac.yaml
