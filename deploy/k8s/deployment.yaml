# __IMAGE__ is substituted by the deploy CI job with $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA.
# Static build, nginx proxies /api/ to meishi-api's ClusterIP service internally
# (see nginx.conf) - no CORS, no runtime secrets needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meishifrontend
  labels:
    app: meishifrontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meishifrontend
  template:
    metadata:
      labels:
        app: meishifrontend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: app
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
