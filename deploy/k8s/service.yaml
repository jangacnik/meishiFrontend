# NodePort on the LAN at http://<node-ip>:30084/. externalTrafficPolicy: Local keeps the client address
# (no SNAT) so nginx can trust X-Real-IP from the edge proxy only. It also means only nodes that run a
# meishifrontend pod answer on 30084: the edge proxy must forward to such a node.
apiVersion: v1
kind: Service
metadata:
  name: meishifrontend
  labels:
    app: meishifrontend
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: meishifrontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30084
