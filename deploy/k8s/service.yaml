# NodePort - reachable on the LAN at http://<any-k8s-node-ip>:30084/
apiVersion: v1
kind: Service
metadata:
  name: meishifrontend
  labels:
    app: meishifrontend
spec:
  type: NodePort
  selector:
    app: meishifrontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30084
